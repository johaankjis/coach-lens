name: CoachLens checks

on:
  pull_request:
  push:
    branches: [main, feat/m2-data-foundation, review/m2-data-foundation, feat/m3-diagnostic-engine, review/m3-diagnostic-engine, feat/m4-review-workspace, review/m4-review-workspace]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'services/api[dev]'
      - run: python -m pytest services/api/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build
